# Despliegue en Render (https://render.com) con un clic: New > Blueprint > elige este repositorio.
# Crea el servidor web y la base de datos PostgreSQL. Render pide los valores marcados con sync: false.
services:
  - type: web
    name: easystock
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Al arrancar: aplica migraciones, crea los roles y (la primera vez) el usuario administrador.
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py crear_roles &&
      (python manage.py createsuperuser --noinput || true) &&
      gunicorn config.wsgi --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: easystock-db
          property: connectionString
      # Usuario dueño (administrador). Solo se usa la primera vez.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        value: ""
      # Código para "Crear nueva cuenta" en la app. Vacío = solo el administrador crea usuarios.
      - key: CODIGO_REGISTRO
        sync: false

databases:
  - name: easystock-db
    plan: free
